<title>A1 — QR</title>
<meta name="description" content="Akvantis A1 — the code on the carton. Scan it to open the product page.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111211">
<link rel="icon" type="image/png" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   QR BOX DEMO (2026-10-07). One thing on a black page: the code that is printed
   on the A1 carton. Shown on a screen at a presentation; a phone pointed at it
   opens the product page.

   WHERE IT LEADS — one line, `TARGET` in the script below.

   The code is black on a white plate, not white on black: an inverted QR is
   not read by a good share of phone cameras, and a code that does not scan is
   worse than none. The plate is the quiet zone the standard asks for (4
   modules) and a little more.

   THE CODE IS A PICTURE — assets/qr.svg, the code made for the carton (round
   modules, rounded finders), put here as it is (2026-10-07; before that the
   page drew a plain one itself with the Stick Maker's encoder).
   ⚠ It encodes https://qrco.de/digital-passport — a short link of an outside
   service that forwards to the product page, not the product page's own
   address. Where it leads is set in that service, not in this file.
   ───────────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#111211;color:#FCFFFE;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.brand,.mark{position:fixed;top:calc(24px + env(safe-area-inset-top));z-index:2;display:block;pointer-events:none}
.brand{left:24px;width:24px;height:24px}
.mark{right:24px;height:24px}
.mark svg{height:100%;width:auto;display:block}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
/* the plate: a square, 56 % of the shorter side, never larger than 560 */
.code{display:block;width:min(56vmin, 560px);aspect-ratio:1;padding:min(1.6vmin, 16px);border-radius:min(3.2vmin, 32px);
  background:#FFFFFF;color:#010006;text-decoration:none;cursor:pointer}
.code img{width:100%;height:100%;display:block}
.code:focus-visible{outline:2px solid rgba(252,255,254,.32);outline-offset:6px}
@media (max-width:767px){
  .brand{left:16px}.mark{right:16px;height:16px}
  .code{width:min(78vmin, 560px)}
}
</style>
</head>

<div class="stage">
  <!-- a link too: on a phone, where there is nothing to scan it with, a tap opens the same page -->
  <a class="code" id="code" aria-label="Open the A1 product page"><img src="assets/qr.svg?v=1" alt="QR code — the A1 product page" width="560" height="560"></a>
</div>

<script>
(function(){
  'use strict';
  /* Where a TAP leads. The code itself (assets/qr.svg) leads where its short
     link is pointed; the carton's real address is
     https://a1.akvantis.com/01/04270005511009. */
  var TARGET = 'https://akvantis-digital-passport-landing-page.michaelkondratenko.com/';
  /* a tap opens the product page directly (the picture is for cameras) */
  document.getElementById('code').href = TARGET;
}());
</script>
